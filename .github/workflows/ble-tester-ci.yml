name: BLE-Tester Build

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/ble-tester/**'
      - 'src/services/ble/parsers/boschLdiParser.ts'
      - 'src/services/ble/parsers/bafangParser.ts'
      - 'src/types/navigation.ts'
      - '.github/workflows/ble-tester-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/ble-tester/**'
      - 'src/services/ble/parsers/boschLdiParser.ts'
      - 'src/services/ble/parsers/bafangParser.ts'
      - 'src/types/navigation.ts'
      - '.github/workflows/ble-tester-ci.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build BLE-Tester Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools/ble-tester

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: tools/ble-tester/package-lock.json

      - name: Setup Java JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check + Web Build
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wegweiser-ble-tester-debug-apk
          path: tools/ble-tester/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
