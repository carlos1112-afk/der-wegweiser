name: Der Wegweiser CI & Automated Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    name: Lint, Secret Scan & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Automated Secret Scan
        run: node scripts/scan_secrets.js

      - name: Run 15 Android Mission-Critical Scenarios Test
        run: node scripts/test_15_scenarios.mjs

      - name: Run Linting (Oxlint)
        run: npm run lint

      - name: Run TypeScript & Vite Production Build
        run: npm run build

  android-build:
    name: Android Capacitor Build
    runs-on: ubuntu-latest
    needs: security-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: der-wegweiser-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
