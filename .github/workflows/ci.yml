name: Der Wegweiser CI & Automated Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    name: Lint, Secret Scan & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK (Java 21)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Automated Secret Scan
        run: node scripts/scan_secrets.js

      - name: Dependency Policy & Security Audit
        run: node scripts/check_dependencies.js

      - name: Run Android Mission-Critical Scenarios Test
        run: node scripts/test_mission_critical_scenarios.mjs

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore Security-Rules Tests
        run: npm run test:rules

      - name: Run Linting (Oxlint)
        run: npm run lint

      - name: Run TypeScript & Vite Production Build
        run: npm run build

  android-build:
    name: Android Capacitor Build
    runs-on: ubuntu-latest
    needs: security-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK (Java 21)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: der-wegweiser-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
